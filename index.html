<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valentine's Day - A Little Love Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene" id="scene">
      <div class="sky"></div>

      <section class="paper" id="mainView">
        <div class="stamp"></div>
        <p class="eyebrow">For you</p>
        <h1>Happy Valentine's Day</h1>
        <p class="subhead">
          A note carried by stars, sealed with a heartbeat.
        </p>
        <div class="actions">
          <button class="btn btn-solid" id="replay">Replay</button>
          <button class="btn btn-outline" id="openCards">Cards</button>
        </div>
      </section>

      <div class="orbit">
        <div class="heart h1"></div>
        <div class="heart h2"></div>
        <div class="heart h3"></div>
        <div class="heart h4"></div>
        <div class="heart h5"></div>
      </div>

      <div class="sparkles">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>
        <span class="spark s7"></span>
        <span class="spark s8"></span>
      </div>

      <section class="cards-panel" id="cardsView" aria-hidden="true">
        <div class="cards-head">
          <p class="eyebrow">Pick a card</p>
          <h2>Valentine Card Gallery</h2>
          <button class="btn btn-solid" id="backHome">Back</button>
        </div>
        <div class="cards-grid">
          <button class="card-option c1" data-card-title="Classic">
            <span class="card-option-title">Classic</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c2" data-card-title="Sweet">
            <span class="card-option-title">Sweet</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c3" data-card-title="Playful">
            <span class="card-option-title">Playful</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c4" data-card-title="Warm">
            <span class="card-option-title">Warm</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c5" data-card-title="Poetic">
            <span class="card-option-title">Poetic</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c6" data-card-title="Forever">
            <span class="card-option-title">Forever</span>
            <span class="card-option-hint">Open full card</span>
          </button>
        </div>
        <section class="card-detail" id="cardDetail" aria-hidden="true">
          <p class="eyebrow">Card preview</p>
          <h3 id="detailTitle">Classic</h3>
          <p id="detailMessage">
            Your full Valentine card content for this style will go here.
          </p>
          <div class="card-detail-actions">
            <button class="btn btn-outline" id="backToOptions">Back to options</button>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
