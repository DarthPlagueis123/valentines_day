<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valentine's Day - A Little Love Animation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="vader.css" />
  </head>
  <body>
    <main class="scene" id="scene">
      <div class="sky"></div>

      <section class="paper" id="mainView">
        <div class="stamp"></div>
        <p class="eyebrow">For you</p>
        <h1>Happy Valentine's Day</h1>
        <div class="actions">
          <button class="btn btn-solid" id="replay">Replay</button>
          <button class="btn btn-outline" id="openCards">Cards</button>
        </div>
      </section>

      <div class="orbit">
        <div class="heart h1"></div>
        <div class="heart h2"></div>
        <div class="heart h3"></div>
        <div class="heart h4"></div>
        <div class="heart h5"></div>
      </div>

      <div class="sparkles">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>
        <span class="spark s6"></span>
        <span class="spark s7"></span>
        <span class="spark s8"></span>
      </div>

      <section class="cards-panel" id="cardsView" aria-hidden="true">
        <div class="cards-head">
          <p class="eyebrow">Pick a card</p>
          <h2>Valentine Card Gallery</h2>
          <div class="cards-head-actions">
            <button class="btn btn-outline" id="backToOptions">Back to cards</button>
            <button class="btn btn-solid" id="backHome">Back to Home</button>
          </div>
        </div>
        <div class="cards-grid">
          <button class="card-option c1" data-card-key="starwars" data-card-title="Star Wars">
            <span class="card-option-title">Star Wars</span>
            <span class="card-option-hint">Open full card</span>
          </button>
          <button class="card-option c7" data-card-key="pickleball" data-card-title="Pickleball">
            <span class="card-option-title">Pickleball</span>
            <span class="card-option-hint">Open full card</span>
          </button>
        </div>
        <section class="card-detail" id="cardDetail" aria-hidden="true">
          <h3 id="detailTitle">Classic</h3>
          <p id="detailMessage">
            Your full Valentine card content for this style will go here.
          </p>
          <div class="vader-scene" id="vaderScene" aria-hidden="true">
            <div class="starcruiser"></div>
            <div class="vader">
              <div class="head">
                <div class="helmet"></div>
                <div class="eye">
                  <div class="fire"></div>
                  <div class="shine"></div>
                </div>
                <div class="eye right">
                  <div class="fire"></div>
                  <div class="shine"></div>
                </div>
                <div class="mark"></div>
                <div class="nouse"></div>
                <div class="ball"></div>
                <div class="ball right"></div>
                <div class="mask"></div>
                <div class="arc"></div>
                <div class="arc right"></div>
                <div class="shine"></div>
                <div class="border"></div>
                <div class="border right"></div>
              </div>
              <div class="neck"></div>
              <div class="chest"></div>
              <div class="saber"></div>
            </div>
          </div>
          <div class="pickleball-scene" id="pickleballScene" aria-hidden="true">
            <p class="pickleball-line top">I Dink</p>
            <p class="pickleball-line mid">You're The Best,</p>
            <p class="pickleball-line bottom">Valentine!</p>
            <span class="pickleball-heart ph1"></span>
            <span class="pickleball-heart ph2"></span>
            <span class="pickleball-heart ph3"></span>
            <span class="pickleball-heart ph4"></span>
            <div class="paddle paddle-left"><span class="handle"></span></div>
            <div class="paddle paddle-right"><span class="handle"></span></div>
            <div class="pickleball-ball"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
